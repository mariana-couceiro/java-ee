info:
  name: nome-especie
  type: http

http:
  method: POST
  url: http://localhost:8080/api/personagem
  body:
    type: json
    data: |-
      {
        "nome": "Morty",
        "especie": "Humano"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
