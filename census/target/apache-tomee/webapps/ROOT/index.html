<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Censo Rick & Morty</title>
</head>
<body>

    <h1>CENSO RICK & MORTY</h1>

    <form action="census" method="get">

        <label>Offset:</label><br>
        <input type="text" name="offset" value="1"><br><br>

        <label>Limit:</label><br>
        <input type="text" name="limit" value="20"><br><br>

        <label>Mostrar Alertas:(true/false)</label><br>
        <input type="text" name="showAlerts" value="true"><br><br>

        <input type="submit" value="Executar Censo">

    </form>

</body>
</html>
